version: "3.8"

services:
  villagomez: 
    image: ghcr.io/davidvmuela/david:1.0.1
    deploy:
      replicas: 1
      labels:
         - "traefik.enable=true"
         - "traefik.http.routers.villagomez.entrypoints=http"
         - "traefik.http.routers.villagomez.rule=Host(`villagomez.byronrm.com`)"
         - "traefik.http.middlewares.villagomez-https-redirect.redirectscheme.scheme=https"
         - "traefik.http.routers.villagomez.middlewares=villagomez-https-redirect"
         - "traefik.http.routers.villagomez-secure.entrypoints=https"
         - "traefik.http.routers.villagomez-secure.rule=Host(`villagomez.byronrm.com`)"
         - "traefik.http.routers.villagomez-secure.tls=true"
         - "traefik.http.routers.villagomez-secure.tls.certresolver=http"
         - "traefik.http.routers.villagomez-secure.service=villagomez"
         - "traefik.http.services.villagomez.loadbalancer.server.port=80"
         - "traefik.docker.network=traefik-public"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true